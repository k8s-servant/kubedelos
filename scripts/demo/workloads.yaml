# The demo cluster's workloads for the README pictures (scripts/demo/cluster.sh): old public images with known CVEs,
# spread so the risk score has something to weigh. shop/web is reachable through an Ingress, ops/node-agent is
# privileged with a hostPath and a cluster-admin ServiceAccount, the rest sit behind ClusterIP Services or nothing.
# Placeholders only: example.com owners and hosts.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels: {kubedelos.io/team: storefront}
  annotations: {kubedelos.io/owner-email: storefront@example.com}
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels: {kubedelos.io/team: platform}
  annotations: {kubedelos.io/owner-email: platform@example.com}
---
apiVersion: v1
kind: Namespace
metadata:
  name: ops
  labels: {kubedelos.io/team: sre}
  annotations: {kubedelos.io/owner-email: sre@example.com}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.19
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: shop}
spec:
  selector: {app: web}
  ports: [{port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: web, namespace: shop}
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 80}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop}
spec:
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: python:3.8-slim
          command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: shop}
spec:
  selector: {app: api}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cache, namespace: data}
spec:
  selector: {matchLabels: {app: cache}}
  template:
    metadata: {labels: {app: cache}}
    spec:
      containers:
        - name: redis
          image: redis:6.0.5
---
apiVersion: v1
kind: Service
metadata: {name: cache, namespace: data}
spec:
  selector: {app: cache}
  ports: [{port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: cache-isolated, namespace: data}
spec:
  podSelector: {matchLabels: {app: cache}}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: data}
spec:
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: postgres
          image: postgres:12.2
          env: [{name: POSTGRES_PASSWORD, value: demo-only}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: node-agent, namespace: ops}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: demo-node-agent-admin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects: [{kind: ServiceAccount, name: node-agent, namespace: ops}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-agent, namespace: ops}
spec:
  selector: {matchLabels: {app: node-agent}}
  template:
    metadata: {labels: {app: node-agent}}
    spec:
      serviceAccountName: node-agent
      hostPID: true
      containers:
        - name: agent
          image: alpine:3.12
          command: ["sleep", "infinity"]
          securityContext: {privileged: true}
          volumeMounts: [{name: host, mountPath: /host}]
      volumes: [{name: host, hostPath: {path: /}}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: report, namespace: ops}
spec:
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: node:14-alpine
              command: ["node", "-e", "console.log('report')"]
