{{- /* Reading the imagePullSecrets of scanned pods: get on Secrets, namespace by namespace, and nothing cluster-wide. */ -}}
{{- if .Values.registries.podPullSecrets }}
{{- range .Values.registries.podPullSecretNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubedelos.fullname" $ }}-pull-secrets
  namespace: {{ . }}
  labels:
    {{- include "kubedelos.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubedelos.fullname" $ }}-pull-secrets
  namespace: {{ . }}
  labels:
    {{- include "kubedelos.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubedelos.fullname" $ }}-pull-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kubedelos.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
