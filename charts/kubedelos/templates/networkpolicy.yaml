{{- /* Ingress only from networkPolicy.ingressFrom (nothing by default); egress stays open unless rules are given. */ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubedelos.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedelos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubedelos.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  {{- with .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
