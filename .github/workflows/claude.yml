name: Claude

# Runs Claude Code when a maintainer mentions @claude in an issue, a PR comment or a
# review, so it can answer questions, fix issues and push its work to a branch. Only
# trusted authors (owner, org members, collaborators) can trigger it, because the job
# holds write permissions and the Claude credential.
#
# Claude runs only when every human in the thread is a trusted author and the code comes
# from this repository (not a fork). Outsider-written text could steer a model holding a
# write token, so on any other thread the job skips Claude and says why in the run log.
# On a trusted thread Claude may run pytest and ruff to check its work before pushing.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] gated on trusted author_association below
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Decide whether the thread is trusted
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association || github.event.pull_request.author_association }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          case "${AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "::notice::Skipping Claude: #${NUMBER} was opened by someone outside the org."
              echo "trusted=false" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          is_pr=false
          head="${PR_HEAD_REPO}"
          if [ -n "${PR_HEAD_REPO}" ] || [ "${EVENT#pull_request}" != "${EVENT}" ]; then
            is_pr=true
          fi
          if [ "${EVENT}" = issue_comment ] && [ -n "${ISSUE_PR_URL}" ]; then
            is_pr=true
            head=$(gh api "${ISSUE_PR_URL}" --jq '.head.repo.full_name // ""')
          fi
          # Everything Claude reads must come from trusted people: every human comment in
          # the thread (and, on a PR, every review comment) too, not only the author's text.
          # Plain assignments, so a failed API call stops the job instead of failing open.
          # Only our own bots are exempt; any other bot may relay outsider text.
          own_bots='select(.user.login | IN("claude[bot]", "github-actions[bot]") | not)'
          who=$(gh api --paginate "repos/${REPO}/issues/${NUMBER}/comments" \
            --jq ".[] | ${own_bots} | .author_association")
          if [ "${is_pr}" = true ]; then
            more=$(gh api --paginate "repos/${REPO}/pulls/${NUMBER}/comments" \
              --jq ".[] | ${own_bots} | .author_association")
            reviews=$(gh api --paginate "repos/${REPO}/pulls/${NUMBER}/reviews" \
              --jq ".[] | ${own_bots} | select((.body // \"\") != \"\") | .author_association")
            who="${who}"$'\n'"${more}"$'\n'"${reviews}"
          fi
          untrusted=$(printf '%s\n' "${who}" | grep -vcE '^(OWNER|MEMBER|COLLABORATOR)?$' || true)
          if [ "${untrusted}" != 0 ]; then
            echo "::notice::Skipping Claude: someone outside the org commented on #${NUMBER}."
            echo "trusted=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # A PR whose head repo is unknown (deleted fork) counts as untrusted.
          if [ "${is_pr}" = false ] || [ "${head}" = "${REPO}" ]; then
            echo "trusted=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Skipping Claude: #${NUMBER} is a fork PR."
            echo "trusted=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.trust.outputs.trusted == 'true'
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        if: steps.trust.outputs.trusted == 'true'
        run: python -m venv .venv && .venv/bin/pip install --quiet -e '.[dev]'
      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        if: steps.trust.outputs.trusted == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # pytest runs repository code by design; the trust step above gates it.
          claude_args: >-
            --allowedTools "Bash(.venv/bin/pytest:*),Bash(.venv/bin/ruff check:*),Bash(.venv/bin/ruff format:*)"
