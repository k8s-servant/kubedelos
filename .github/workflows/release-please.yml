name: Release

# release-please keeps a release PR open from Conventional Commit history. Merging it
# tags vX.Y.Z and creates the GitHub release; the jobs below then publish the
# Python package to PyPI (only when the PUBLISH_ENABLED repository variable is 'true') and
# push the container image and the Helm chart to GHCR, both signed with cosign.
#
# release-please runs with a GitHub App token, not GITHUB_TOKEN: GitHub does not start
# workflows on its own for events that GITHUB_TOKEN creates, so the release PR's checks
# would wait for a maintainer to approve them. The App needs Contents, Pull requests and
# Issues (read and write) on this repository; its Client ID is the repository variable
# RELEASE_APP_CLIENT_ID and its private key the secret RELEASE_APP_PRIVATE_KEY, both
# held in the `release` environment. The
# publish jobs keep GITHUB_TOKEN, and the signing identity stays this workflow file.
# The GHCR paths take the owner from the repository that runs the workflow, so a fork's dry run
# pushes to its own namespace; GHCR wants lowercase names, which both owners are.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # The App key and client ID live in the `release` environment, whose deployment
    # branches must be limited to main, so no other branch can read them.
    environment: release
    permissions: {} # release-please uses the App token
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    # Builds one platform per job on a native runner (arm64 under QEMU took about 9 times longer) and pushes it by
    # digest, with SBOM and max-mode provenance, without id-token, so the build steps cannot sign anything. The
    # image-merge job tags the multi-arch index and sign-image signs it. Gated on the release only, not on
    # PUBLISH_ENABLED, which covers PyPI. The Trivy bundled in the image is downloaded and checksum-verified during the
    # build.
    name: build image (${{ matrix.platform }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kubedelos
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Keep the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "${GITHUB_ENV}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    # Joins the per-platform images (each an index with its own SBOM and provenance) into one multi-arch index,
    # tagged X.Y.Z and X.Y. No build steps and no id-token.
    name: tag multi-arch image
    needs: [release-please, image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write # push the index to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kubedelos
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the X.Y.Z and X.Y tags from both platforms
        id: merge
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -o pipefail
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "expected 2 platform digests, got ${#sources[@]}" >&2; exit 1; }
          metadata="${RUNNER_TEMP}/merge.json"
          docker buildx imagetools create --metadata-file "${metadata}" \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${VERSION%.*}" "${sources[@]}"
          # The digest comes from the create itself, never from re-reading the tag, so a tag moved in between can't
          # be what gets signed. The index is then checked by digest: it must hold exactly the manifests of the two
          # platform pushes (each image and its attestations), for linux/amd64 and linux/arm64.
          digest="$(jq -r '."containerimage.descriptor".digest' "${metadata}")"
          case "${digest}" in sha256:*) ;; *) echo "imagetools create reported no digest" >&2; exit 1 ;; esac
          want="$(for s in "${sources[@]}"; do docker buildx imagetools inspect "${s}" --raw | jq -r '.manifests[].digest'; done | sort)"
          raw="$(docker buildx imagetools inspect "${IMAGE}@${digest}" --raw)"
          got="$(jq -r '.manifests[].digest' <<<"${raw}" | sort)"
          [ "${got}" = "${want}" ] || { echo "the index does not hold exactly the two platform pushes" >&2; exit 1; }
          arches="$(jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | join(",")' <<<"${raw}")"
          [ "${arches}" = "amd64,arm64" ] || { echo "the index has platforms ${arches}, not amd64,arm64" >&2; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  sign-image:
    # Signs the pushed image digest keylessly: cosign trusts this workflow's OIDC identity. It runs no
    # build steps, so nothing it executes comes from the image build.
    name: sign image
    needs: [release-please, image-merge]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write # push the signature next to the image
      id-token: write # keyless cosign signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kubedelos
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image digest
        env:
          DIGEST: ${{ needs.image-merge.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  chart:
    # Packages the Helm chart at the release version and pushes it to GHCR as an OCI artifact, without
    # id-token (sign-chart signs the digest). It waits for the image so a published chart never points
    # at a missing image. Helm is the same pinned, checksum-verified release the CI chart job uses.
    name: package and push chart
    needs: [release-please, image-merge]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    env:
      CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
      HELM_VERSION: 4.3.2 # keep in step with ci.yml
      HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983 # linux-amd64 tarball; bump with the version
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Install helm (pinned SHA-256)
        run: |
          tarball="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors "https://get.helm.sh/${tarball}"
          echo "${HELM_SHA256}  ${tarball}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/helm"
          tar -xzf "${tarball}" --strip-components=1 -C "${RUNNER_TEMP}/helm" linux-amd64/helm
          echo "${RUNNER_TEMP}/helm" >> "${GITHUB_PATH}"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push the chart
        id: push
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -o pipefail
          helm package charts/kubedelos --version "${VERSION}" --app-version "${VERSION}" --destination "${RUNNER_TEMP}"
          helm push "${RUNNER_TEMP}/kubedelos-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee "${RUNNER_TEMP}/push.log"
          digest="$(sed -n 's/^Digest: //p' "${RUNNER_TEMP}/push.log")"
          case "${digest}" in sha256:*) ;; *) echo "no chart digest in the helm push output" >&2; exit 1 ;; esac
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  sign-chart:
    # Signs the pushed chart digest keylessly, in a job that runs no packaging steps.
    name: sign chart
    needs: [release-please, chart]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write # push the signature next to the chart
      id-token: write # keyless cosign signing
    env:
      CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the chart digest
        env:
          DIGEST: ${{ needs.chart.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO}/kubedelos@${DIGEST}"

  pypi-build:
    # Built in its own job, without id-token, so the build steps cannot sign anything.
    name: build python package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  pypi:
    # Trusted publishing: PyPI accepts this workflow's OIDC token for the pypi
    # environment, so no API token is stored. The action also uploads the PEP 740
    # attestations, signed as this workflow.
    name: publish to PyPI
    needs: [release-please, pypi-build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kubedelos/${{ needs.release-please.outputs.version }}/
    permissions:
      id-token: write # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  mcp-registry:
    # Lists the new version in the MCP Registry (io.github.k8s-servant/kubedelos). The registry checks the mcp-name in
    # the PyPI description, so this runs after PyPI. It logs in with this workflow's OIDC token, so no token is stored.
    # mcp-publisher is a pinned release checked against its SHA-256, and the job runs no build steps.
    name: publish to the MCP Registry
    needs: [release-please, pypi]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05 # linux-amd64 tarball; bump with the version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Install mcp-publisher (pinned SHA-256)
        run: |
          tarball=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL --retry 5 --retry-all-errors -o "${tarball}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${tarball}"
          echo "${MCP_PUBLISHER_SHA256}  ${tarball}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/mcp-publisher"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/mcp-publisher" mcp-publisher
          echo "${RUNNER_TEMP}/mcp-publisher" >> "${GITHUB_PATH}"
      - name: Publish server.json
        run: |
          mcp-publisher login github-oidc
          # PyPI can take a moment to serve the new description the registry checks.
          for attempt in 1 2 3 4 5; do
            mcp-publisher publish && exit 0
            echo "publish attempt ${attempt} failed; retrying in 30s" >&2
            sleep 30
          done
          exit 1
