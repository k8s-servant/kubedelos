name: Claude review

# Automatic Claude review on every non-draft PR from a branch in this repository.
# Fork PRs are skipped: they get no secrets, and running a model on untrusted code
# with write access is a prompt-injection risk. Maintainers can still ask for a review
# on a fork PR by commenting "@claude review".
# Bot PRs (release-please, Dependabot) are skipped too: they are generated, and the
# action refuses to run for non-human actors.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the conventions in AGENTS.md. Focus, in order:

            1. **Read-only cluster access.** Flag anything that could change cluster
               objects, read Secrets, or widen RBAC beyond get/list/watch.
            2. **Credentials.** Registry tokens and other credentials must never reach
               disk, SQLite or logs, including error messages.
            3. **Trivy pinning.** Trivy stays pinned with a per-platform SHA-256, never
               resolves "latest", and scans with `--scanners vuln` only.
            4. **Correctness.** Bugs, unhandled errors, concurrency and signal handling,
               edge cases in image refs and exit codes.
            5. **Tests.** New behavior has tests written against the module's test file;
               tests are meaningful.
            6. **CI and docs.** Actions stay SHA-pinned with least privilege; README,
               docs/ and CHANGELOG.md match the change.

            Use inline comments for specific lines and one short summary comment.
            Skip praise and style nits that ruff already enforces. If nothing is
            wrong, say so in one sentence.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
