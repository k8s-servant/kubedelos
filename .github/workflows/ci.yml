name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest --cov=kubedelos --cov-report=term-missing --cov-report=xml
      - if: matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  package:
    # The wheel the release publishes to PyPI: it must build, pass twine's checks, and
    # install and run in a clean environment outside the git checkout.
    name: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the entrypoints
        run: |
          python -m venv "${RUNNER_TEMP}/wheel"
          "${RUNNER_TEMP}/wheel/bin/pip" install dist/*.whl
          cd "${RUNNER_TEMP}"
          wheel/bin/kubedelos version
          wheel/bin/delos

  result:
    # The one check the branch ruleset requires, so jobs can be added or renamed freely.
    name: CI result
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: No job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
