name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest --cov=kubedelos --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - if: matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  package:
    # The wheel the release publishes to PyPI: it must build, pass twine's checks, and
    # install and run in a clean environment outside the git checkout.
    name: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the entrypoint
        run: |
          python -m venv "${RUNNER_TEMP}/wheel"
          "${RUNNER_TEMP}/wheel/bin/pip" install dist/*.whl
          cd "${RUNNER_TEMP}"
          wheel/bin/kubedelos version

  chart:
    # The Helm chart: lint it, run the render tests (they need helm, so CI makes a missing helm a
    # failure), and validate the rendered manifests against the Kubernetes schemas for the default
    # values and for charts/kubedelos/ci/all-on-values.yaml, which switches every optional template on.
    # The HTTPRoute schema comes from the datreeio CRDs catalog, because kubeconform ships none for it;
    # the catalog is pinned to its main commit of 2026-11-18 so a catalog change cannot break CI.
    name: chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HELM_VERSION: 4.3.2 # v4: the NOTES tests rely on its --dry-run=client
      KUBECONFORM_VERSION: 0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install helm (checksum verified)
        run: |
          tarball="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors "https://get.helm.sh/${tarball}"
          curl -fsSLO --retry 5 --retry-all-errors "https://get.helm.sh/${tarball}.sha256sum"
          sha256sum -c "${tarball}.sha256sum"
          tar -xzf "${tarball}" --strip-components=1 -C "${RUNNER_TEMP}" linux-amd64/helm
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install kubeconform (checksum verified)
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          tarball="kubeconform-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors "${base}/${tarball}"
          curl -fsSLO --retry 5 --retry-all-errors "${base}/CHECKSUMS"
          grep " ${tarball}$" CHECKSUMS | sha256sum -c -
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}" kubeconform
      - run: helm lint charts/kubedelos --set clusterName=my-cluster
      - run: pip install -e '.[dev]'
      - run: pytest tests/chart -q --no-cov
        env:
          KUBEDELOS_REQUIRE_HELM: "1"
      - name: Validate the rendered manifests (default values)
        run: helm template t charts/kubedelos --namespace kd --set clusterName=my-cluster | kubeconform -strict -summary
      - name: Validate the rendered manifests (everything on)
        run: |
          helm lint charts/kubedelos -f charts/kubedelos/ci/all-on-values.yaml
          helm template t charts/kubedelos --namespace kd -f charts/kubedelos/ci/all-on-values.yaml |
            kubeconform -strict -summary -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/784ec895547a36e548e6810b41f27baade3a0890/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  image:
    # The container image: build it for amd64, smoke-test it (scripts/image-smoke.sh runs it the way
    # the chart does), check it also builds for arm64 (not loaded, so QEMU only has to get through
    # the build), and fail on a fixable CRITICAL finding, scanned with the same pinned Trivy the
    # product uses. The scan binary comes from `kubedelos trivy install`, never from a Trivy action.
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the amd64 image
        run: docker buildx build --platform linux/amd64 --load -t kubedelos:ci .
      - name: Smoke-test the image
        run: scripts/image-smoke.sh kubedelos:ci
      - name: Build the arm64 image (not loaded)
        run: docker buildx build --platform linux/arm64 .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install -e .
      - name: Scan the image for fixable CRITICAL vulnerabilities
        run: |
          trivy="$(kubedelos trivy install | sed -n 's/^Trivy .* installed at //p')"
          test -x "${trivy}"
          "${trivy}" image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 kubedelos:ci

  e2e-chart:
    # Installs the chart on a throwaway kind cluster with the image built from this checkout, and waits
    # for the first scheduled sweep to finish (scripts/e2e-chart.sh). The first sweep downloads the
    # Trivy DB, hence the long timeout. kubectl and docker come with the runner image.
    name: e2e-chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HELM_VERSION: 4.3.2
      KIND_VERSION: 0.33.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm (checksum verified)
        run: |
          tarball="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors "https://get.helm.sh/${tarball}"
          curl -fsSLO --retry 5 --retry-all-errors "https://get.helm.sh/${tarball}.sha256sum"
          sha256sum -c "${tarball}.sha256sum"
          tar -xzf "${tarball}" --strip-components=1 -C "${RUNNER_TEMP}" linux-amd64/helm
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install kind (checksum verified)
        run: |
          base="https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}"
          curl -fsSLO --retry 5 --retry-all-errors "${base}/kind-linux-amd64"
          curl -fsSLO --retry 5 --retry-all-errors "${base}/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          install -m 0755 kind-linux-amd64 "${RUNNER_TEMP}/kind"
      - name: Install the chart on kind and wait for a sweep
        run: scripts/e2e-chart.sh

  result:
    # The one check the branch ruleset requires, so jobs can be added or renamed freely.
    name: CI result
    if: always()
    needs: [lint, test, package, chart, image, e2e-chart]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: No job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
