version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "area/python"]

  # The container image's hashed locks (scripts/lock-image.sh). Dependabot bumps the pins it finds in place and does not
  # re-resolve; a bump with wrong hashes fails the PR's image build, and one that breaks the dependency tree fails its
  # pip check. Regenerating with scripts/lock-image.sh is the fix in both cases. A pyproject.toml bump the lock no longer
  # satisfies fails tests/test_packaging.py.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      image:
        patterns: ["*"]
    labels: ["dependencies", "area/container"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "area/ci"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
